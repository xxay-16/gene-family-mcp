[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "backend_service/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["backend_service", "mcp_server"]
omit = [
  "backend_service/manage.py",
  "backend_service/config/asgi.py",
  "backend_service/config/wsgi.py",
  "backend_service/**/migrations/*",
  "backend_service/scripts/*",
  "*/tests.py",
  "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
